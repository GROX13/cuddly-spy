databaseChangeLog:
  - changeSet:
      id: 002-create-withdrawals
      author: giorgi.rokhadze
      changes:
        - createTable:
            tableName: withdrawals
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_withdrawals
                    nullable: false
              - column:
                  name: time_deposit_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_withdrawals_time_deposit
                    referencedTableName: time_deposits
                    referencedColumnNames: id
              - column:
                  name: amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: date
                  type: DATE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: withdrawals
            indexName: idx_withdrawals_time_deposit_id
            columns:
              - column:
                  name: time_deposit_id
