# Project-scoped Codex config; loaded only when this project is trusted in ~/.codex/config.toml.
# Codex reads AGENTS.md and .agents/skills/ natively. Command rules: .codex/rules/guardrails.rules.

# Default sandbox: the built-in workspace-write profile, plus the assignment README.md, the
# characterization tests (TimeDepositCalculatorTest.kt) and ArchitectureTest.kt read-only.
# Covers shell writes and apply_patch while the sandbox is on. Full access (/permissions,
# --sandbox danger-full-access, --yolo) switches it off; the pre-commit hook still applies.
# Workspace roots follow cwd, so start Codex from the repo root.
default_permissions = "kata"

[permissions.kata]
description = "Workspace write, with the assignment README.md and the protected tests read-only"
extends = ":workspace"

[permissions.kata.filesystem.":workspace_roots"]
"README.md" = "read"
"kotlin/src/test/kotlin/org/ikigaidigital/TimeDepositCalculatorTest.kt" = "read"
"kotlin/src/test/kotlin/org/ikigaidigital/ArchitectureTest.kt" = "read"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
# Optional key for higher rate limits; skipped when CONTEXT7_API_KEY is unset or empty.
env_http_headers = { CONTEXT7_API_KEY = "CONTEXT7_API_KEY" }
