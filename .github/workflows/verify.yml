name: Verify

# The same check the pre-commit hook runs, but independent of local setup: tests, ArchUnit rules
# and the Kover coverage gates. ubuntu-latest has Docker, which the Testcontainers ITs need.
on:
  push:
    branches: [main]
    paths:
      - "kotlin/**"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "kotlin/**"
      - ".github/workflows/verify.yml"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven

      - name: Build, test and check coverage
        run: mvn -B -f kotlin/pom.xml clean verify
